PackageName=com.junhyeong.godeliver
ApplicationDisplayName=Go Deliver!
; StoreVersion(versionCode)과 VersionDisplayName은 릴리스 빌드에서 Tools/Verify-Project.ps1 -Package가 -ini 오버라이드로 덮어쓴다(기본: 커밋 수, 1.0.<커밋 수>).
StoreVersion=1
VersionDisplayName=1.0.0
MinSDKVersion=26
; Google Play 신규 앱은 2026-08-31부터 API 36 타깃이 필수다.
TargetSDKVersion=36
InstallLocation=Auto
bPackageDataInsideApk=True
Orientation=Portrait
; 앱 실행 직후 엔진이 첫 프레임을 그릴 때까지 Build/Android/res/drawable/splashscreen_portrait.png(Tools/GenerateAndroidIcons.ps1이 생성)를 보여 준다.
bShowLaunchImage=True
; 20:9 이상 세로 긴 화면에서도 레터박스 없이 전체 화면을 쓴다(엔진 기본 2.4, Google 권장 상한).
MaxAspectRatio=3.0
; 노치·펀치홀 아래까지 그린다. 가장자리 UI(HUD 점수·Pause, Home 영수증·도움말, Shop 닫기)는 WBP의 SafeZone 안에 있어 절개 여백만큼 안쪽으로 밀린다.
bUseDisplayCutout=True
bUseExternalFilesDir=True
bBuildForArm64=True
bBuildForX8664=False
; Google Play 신규 앱은 AAB만 업로드할 수 있다. universal APK는 실기기 설치 테스트용으로 함께 만든다.
bEnableBundle=True
bEnableUniversalAPK=True
