[SystemSettings]
; The bowl rides the animated head socket. Animation must finish before physics so the cargo sees this frame bowl pose (see APGRunnerCharacter::BeginPlay).
tick.AnimationDelaysEndGroup=0

[/Script/Engine.PhysicsSettings]
; Without substeps physics advances at most 1/30 s per frame, so below 30 fps the cargo falls behind the runner and misses the bowl.
; Substeps simulate the rest of the frame instead of dropping it, down to about 5 fps (6 x 0.034 s).
; 0.034 keeps frames at 30 fps and above on a single step exactly as before, so the tuned cargo sway is untouched there. The step count is ceil(frame time / this value), so 1/60 would split jittery 60 fps frames in two.
bSubstepping=True
MaxSubstepDeltaTime=0.034
MaxSubsteps=6

[/Script/Engine.GameEngine]
; A single frame longer than the physics limit above (6 x 0.034 s) moves the runner and bowl for the whole frame but the cargo only for 0.204 s, so one hitch drops cargo out of the bowl.
; Capping the game frame time makes a hitch pass as 0.2 s of game time instead: the runner does not jump ahead blind and physics covers the whole frame. Keep this at or below MaxSubstepDeltaTime x MaxSubsteps.
MaxDeltaTime=0.2
