<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Go Deliver! UI 화면과 상태 흐름</title>
  <desc id="desc">홈 화면에서 상점, 설정, 튜토리얼과 플레이로 이동하고, 플레이 화면에서 일시정지와 결과 화면을 거쳐 재시도하거나 홈으로 돌아오는 흐름과 UI 책임 계층을 보여준다.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#173451"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E47A24"/>
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans KR", sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #FFFFFF; }
      .subtitle { font-size: 17px; fill: #D7E2EC; }
      .lane { font-size: 16px; font-weight: 700; fill: #60758A; letter-spacing: 1px; }
      .card-title { font-size: 21px; font-weight: 700; fill: #173451; }
      .card-body { font-size: 15px; fill: #53697D; }
      .label { font-size: 14px; font-weight: 700; fill: #173451; }
      .label-orange { font-size: 14px; font-weight: 700; fill: #D26915; }
      .layer-title { font-size: 18px; font-weight: 700; fill: #173451; }
      .layer-body { font-size: 14px; fill: #53697D; }
    </style>
  </defs>

  <rect width="1400" height="900" rx="26" fill="#F7F8FA"/>
  <rect x="24" y="24" width="1352" height="112" rx="22" fill="#173451"/>
  <text class="title" x="58" y="72">UI FLOW · 화면보다 상태의 이동을 먼저 설계했습니다</text>
  <text class="subtitle" x="58" y="106">Widget은 요청하고, Controller Component가 화면을 전환하며, GameMode와 UserData가 상태를 확정합니다.</text>

  <text class="lane" x="54" y="180">META FLOW</text>
  <rect x="54" y="198" width="1292" height="170" rx="20" fill="#FFFFFF" stroke="#D4DEE7" stroke-width="2"/>

  <g>
    <rect x="88" y="232" width="200" height="102" rx="16" fill="#E6F5F2" stroke="#159A92" stroke-width="2"/>
    <text class="card-title" x="112" y="270">홈 화면</text>
    <text class="card-body" x="112" y="298">시작 · 잔액 · 최고 점수</text>

    <rect x="370" y="215" width="190" height="72" rx="14" fill="#FFF1DF" stroke="#E47A24" stroke-width="2"/>
    <text class="card-title" x="394" y="247">상점</text>
    <text class="card-body" x="394" y="271">미리보기 · 구매 · 장착</text>

    <rect x="640" y="215" width="210" height="72" rx="14" fill="#FFF7D8" stroke="#D1A21D" stroke-width="2"/>
    <text class="card-title" x="664" y="247">영수증 상점</text>
    <text class="card-body" x="664" y="271">상품 선택 · 결과 피드백</text>

    <rect x="370" y="304" width="190" height="42" rx="12" fill="#EEF2F7" stroke="#7A8DA3" stroke-width="2"/>
    <text class="card-title" x="394" y="332">설정</text>

    <rect x="640" y="304" width="210" height="42" rx="12" fill="#EEF2F7" stroke="#7A8DA3" stroke-width="2"/>
    <text class="card-title" x="664" y="332">튜토리얼</text>

    <path d="M 288 266 H 370" fill="none" stroke="#173451" stroke-width="3" marker-end="url(#arrow-navy)"/>
    <path d="M 560 251 H 640" fill="none" stroke="#173451" stroke-width="3" marker-end="url(#arrow-navy)"/>
    <path d="M 288 286 H 330 V 325 H 370" fill="none" stroke="#7A8DA3" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-navy)"/>
    <path d="M 288 306 H 610 V 325 H 640" fill="none" stroke="#7A8DA3" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-navy)"/>

    <text class="label" x="310" y="250">Open</text>
    <text class="label" x="582" y="238">Open</text>
    <text class="label" x="888" y="242">HomeFlowComponent</text>
    <text class="card-body" x="888" y="270">위젯 생성 · 입력 모드 · 카메라 전환</text>
    <text class="card-body" x="888" y="296">화면별 비동기 예열과 종료 정리</text>
  </g>

  <text class="lane" x="54" y="416">RUN FLOW</text>
  <rect x="54" y="434" width="1292" height="200" rx="20" fill="#FFFFFF" stroke="#D4DEE7" stroke-width="2"/>

  <g>
    <rect x="88" y="476" width="180" height="106" rx="16" fill="#E6F5F2" stroke="#159A92" stroke-width="2"/>
    <text class="card-title" x="112" y="514">카운트다운</text>
    <text class="card-body" x="112" y="542">3 · 2 · 1 · GO!</text>

    <rect x="350" y="476" width="210" height="106" rx="16" fill="#E7EEF7" stroke="#173451" stroke-width="2"/>
    <text class="card-title" x="374" y="514">플레이 HUD</text>
    <text class="card-body" x="374" y="542">점수 · 거리 · 적재 목록</text>

    <rect x="640" y="476" width="190" height="106" rx="16" fill="#FFF1DF" stroke="#E47A24" stroke-width="2"/>
    <text class="card-title" x="664" y="514">결과 화면</text>
    <text class="card-body" x="664" y="542">정산 · Retry · Home</text>

    <rect x="350" y="594" width="210" height="28" rx="10" fill="#F4EAF7" stroke="#8963A9" stroke-width="2"/>
    <text class="label" x="417" y="614">일시정지</text>

    <path d="M 268 529 H 350" fill="none" stroke="#173451" stroke-width="4" marker-end="url(#arrow-navy)"/>
    <path d="M 560 529 H 640" fill="none" stroke="#E47A24" stroke-width="4" marker-end="url(#arrow-orange)"/>
    <path d="M 455 582 V 594" fill="none" stroke="#8963A9" stroke-width="3" marker-end="url(#arrow-navy)"/>
    <path d="M 830 510 H 900 V 456 H 178 V 476" fill="none" stroke="#E47A24" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-orange)"/>
    <path d="M 830 548 H 884" fill="none" stroke="#173451" stroke-width="3" marker-end="url(#arrow-navy)"/>

    <text class="label" x="289" y="514">Run Started</text>
    <text class="label-orange" x="580" y="514">Run Failed</text>
    <text class="label-orange" x="846" y="444">Retry</text>
    <text class="label" x="842" y="539">Home</text>
    <text class="label" x="920" y="506">RunHUDComponent</text>
    <text class="card-body" x="920" y="534">HUD · Pause · Settings</text>
    <text class="label" x="920" y="570">RunResultFeedbackComponent</text>
    <text class="card-body" x="920" y="598">정산 결과 주입 · 재시도 분기</text>
  </g>

  <text class="lane" x="54" y="684">RESPONSIBILITY</text>
  <rect x="54" y="702" width="1292" height="150" rx="20" fill="#FFFFFF" stroke="#D4DEE7" stroke-width="2"/>

  <g>
    <rect x="82" y="735" width="260" height="84" rx="14" fill="#FFF1DF" stroke="#E47A24" stroke-width="2"/>
    <text class="layer-title" x="106" y="768">Widget Blueprint</text>
    <text class="layer-body" x="106" y="794">배치 · 스타일 · 표현 전용 그래프</text>

    <rect x="382" y="735" width="260" height="84" rx="14" fill="#E6F5F2" stroke="#159A92" stroke-width="2"/>
    <text class="layer-title" x="406" y="768">C++ Widget</text>
    <text class="layer-body" x="406" y="794">입력 이벤트 · 데이터 표현 · 애니메이션</text>

    <rect x="682" y="735" width="278" height="84" rx="14" fill="#E7EEF7" stroke="#173451" stroke-width="2"/>
    <text class="layer-title" x="706" y="768">Controller Component</text>
    <text class="layer-body" x="706" y="794">화면 생성 · 입력 모드 · 흐름 전환</text>

    <rect x="1000" y="735" width="314" height="84" rx="14" fill="#FFF7D8" stroke="#D1A21D" stroke-width="2"/>
    <text class="layer-title" x="1024" y="768">GameMode · UserData</text>
    <text class="layer-body" x="1024" y="794">런 상태와 영속 데이터의 단일 원본</text>

    <path d="M 342 777 H 382" fill="none" stroke="#173451" stroke-width="3" marker-end="url(#arrow-navy)"/>
    <path d="M 642 777 H 682" fill="none" stroke="#173451" stroke-width="3" marker-end="url(#arrow-navy)"/>
    <path d="M 960 777 H 1000" fill="none" stroke="#E47A24" stroke-width="3" marker-end="url(#arrow-orange)"/>
  </g>
</svg>
