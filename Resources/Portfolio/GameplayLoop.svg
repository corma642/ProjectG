<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Go Deliver gameplay loop</title>
  <desc id="desc">Six connected steps: Balance, Jump, Protect, Deliver, Earn, and Unlock.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7FFFD"/>
      <stop offset="0.5" stop-color="#E9FBF8"/>
      <stop offset="1" stop-color="#FFF6E7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0B7B86"/>
    </marker>
  </defs>
  <rect width="1200" height="230" rx="26" fill="url(#bg)" stroke="#B6E8E2" stroke-width="2"/>
  <text x="50" y="46" fill="#0B2A3B" font-family="Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2">CORE GAMEPLAY LOOP</text>
  <line x1="50" y1="62" x2="1150" y2="62" stroke="#C6EDE8" stroke-width="2"/>

  <g stroke="#0B7B86" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M190 139 H230"/>
    <path d="M382 139 H422"/>
    <path d="M574 139 H614"/>
    <path d="M766 139 H806"/>
    <path d="M958 139 H998"/>
  </g>

  <g font-family="Arial, sans-serif">
    <g transform="translate(50 88)">
      <rect width="140" height="102" rx="18" fill="#FFFFFF" stroke="#8ADDD5" stroke-width="2"/>
      <circle cx="70" cy="34" r="21" fill="#13BEBE"/>
      <path d="M56 34 H84 M70 21 V47" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <text x="70" y="72" text-anchor="middle" fill="#0B2A3B" font-size="17" font-weight="800">BALANCE</text>
      <text x="70" y="91" text-anchor="middle" fill="#52717C" font-size="11" font-weight="600">DRAG</text>
    </g>
    <g transform="translate(242 88)">
      <rect width="140" height="102" rx="18" fill="#FFFFFF" stroke="#8ADDD5" stroke-width="2"/>
      <circle cx="70" cy="34" r="21" fill="#173A66"/>
      <path d="M58 41 L70 25 L82 41 M70 25 V48" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="72" text-anchor="middle" fill="#0B2A3B" font-size="17" font-weight="800">JUMP</text>
      <text x="70" y="91" text-anchor="middle" fill="#52717C" font-size="11" font-weight="600">FLICK</text>
    </g>
    <g transform="translate(434 88)">
      <rect width="140" height="102" rx="18" fill="#FFFFFF" stroke="#8ADDD5" stroke-width="2"/>
      <circle cx="70" cy="34" r="21" fill="#F28A2E"/>
      <path d="M58 28 H82 V44 H58 Z M64 22 H76 V28" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
      <text x="70" y="72" text-anchor="middle" fill="#0B2A3B" font-size="17" font-weight="800">PROTECT</text>
      <text x="70" y="91" text-anchor="middle" fill="#52717C" font-size="11" font-weight="600">CARGO</text>
    </g>
    <g transform="translate(626 88)">
      <rect width="140" height="102" rx="18" fill="#FFFFFF" stroke="#8ADDD5" stroke-width="2"/>
      <circle cx="70" cy="34" r="21" fill="#13BEBE"/>
      <path d="M58 35 L66 43 L83 25" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="72" text-anchor="middle" fill="#0B2A3B" font-size="17" font-weight="800">DELIVER</text>
      <text x="70" y="91" text-anchor="middle" fill="#52717C" font-size="11" font-weight="600">COMPLETE</text>
    </g>
    <g transform="translate(818 88)">
      <rect width="140" height="102" rx="18" fill="#FFFFFF" stroke="#8ADDD5" stroke-width="2"/>
      <circle cx="70" cy="34" r="21" fill="#173A66"/>
      <path d="M59 25 H81 V44 H59 Z M64 30 H76 M64 35 H76 M64 40 H72" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="70" y="72" text-anchor="middle" fill="#0B2A3B" font-size="17" font-weight="800">EARN</text>
      <text x="70" y="91" text-anchor="middle" fill="#52717C" font-size="11" font-weight="600">RECEIPTS</text>
    </g>
    <g transform="translate(1010 88)">
      <rect width="140" height="102" rx="18" fill="#FFFFFF" stroke="#F2C48E" stroke-width="2"/>
      <circle cx="70" cy="34" r="21" fill="#F28A2E"/>
      <path d="M63 35 V29 A7 7 0 0 1 77 29 V35 M59 35 H81 V47 H59 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="72" text-anchor="middle" fill="#0B2A3B" font-size="17" font-weight="800">UNLOCK</text>
      <text x="70" y="91" text-anchor="middle" fill="#52717C" font-size="11" font-weight="600">CONTENT</text>
    </g>
  </g>
</svg>
